[package]
name = "metrocraft"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "A fast, minimal world transit map editor with real OpenStreetMap basemaps"
license = "MIT"

[dependencies]
ehttp = "0.7"
egui = { version = "0.37", features = ["serde"] }
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "system_fonts",
    "wayland",
    "web_screen_reader",
    "x11",
] }
indexmap = { version = "2", features = ["serde"] }
jpeg-decoder = "0.3"
log = "0.4"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "Url",
    "Window",
] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
